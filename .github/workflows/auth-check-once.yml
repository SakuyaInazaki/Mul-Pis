name: DeepSeek authentication check once
on:
  push:
    branches:
      - improve/workflow-learning-reliability
permissions: {}
concurrency:
  group: deepseek-auth-check-once-20261005
  cancel-in-progress: false
jobs:
  auth-check:
    if: >-
      github.repository == 'SakuyaInazaki/Mul-Pis' &&
      github.actor == 'SakuyaInazaki' &&
      github.run_attempt == 1 &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/improve/workflow-learning-reliability' &&
      github.event.head_commit.message == 'Check DeepSeek authentication only (mul-pis-20261005-auth-once)'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check official read-only model list
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const key = process.env.DEEPSEEK_API_KEY;
          delete process.env.DEEPSEEK_API_KEY;
          if (!key?.trim()) {
            console.log('http_status=unavailable accepted=false');
            process.exitCode = 1;
          } else {
            try {
              const response = await fetch('https://api.deepseek.com/models', {
                method: 'GET',
                headers: { Authorization: `Bearer ${key}`, Accept: 'application/json' },
                redirect: 'error',
                signal: AbortSignal.timeout(15000),
              });
              await response.body?.cancel().catch(() => undefined);
              const status = Number.isInteger(response.status) ? response.status : 'unavailable';
              const accepted = status === 200;
              console.log(`http_status=${status} accepted=${accepted}`);
              if (!accepted) process.exitCode = 1;
            } catch {
              console.log('http_status=unavailable accepted=false');
              process.exitCode = 1;
            }
          }
          NODE
